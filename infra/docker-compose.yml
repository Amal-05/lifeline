services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: lifeline
      POSTGRES_USER: lifeline
      POSTGRES_PASSWORD: lifeline
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeline -d lifeline"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://lifeline:lifeline@db:5432/lifeline
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-before-deploy}
      DEMO_MODE: ${DEMO_MODE:-true}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-coordinator@example.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-demo-only-change-me}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    command: ["python", "-m", "services.api.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://lifeline:lifeline@db:5432/lifeline
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-dev-secret-change-before-deploy}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports: ["4173:80"]
    depends_on: [api]
volumes:
  pgdata:
