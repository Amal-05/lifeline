[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeline"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.163.1", "starlette==1.10.0", "uvicorn[standard]==0.54.0", "pydantic[email]==2.14.3", "sqlalchemy==2.1.9", "psycopg[binary]==3.3.9", "PyNaCl==1.6.2", "python-multipart==0.0.34", "redis==8.1.0", "celery[redis]==5.7.0", "h3==4.5.0", "scipy==1.18.1", "PyJWT==2.15.1", "alembic==1.20.1", "GeoAlchemy2==0.20.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "httpx==0.28.1", "hypothesis==6.170.15", "ruff==0.17.5", "pip-audit==2.10.1"]

[tool.setuptools.packages.find]
include = ["services*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["services", "packages"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
