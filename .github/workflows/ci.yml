name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '26.13.0', cache: npm}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      # Hydrate platform-specific optional packages for the Linux runner.
      - run: npm install --include=optional --no-audit --no-fund
      - run: pip-audit -r requirements.lock
      - run: npm audit --audit-level=moderate
      - run: python -m ruff check .
      - run: python -m compileall -q services packages
      - run: python -m pytest
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: python -c "import json; from services.api.main import app; open('docs/openapi.json','w').write(json.dumps(app.openapi(), indent=2) + '\n')"
      - run: git diff --exit-code -- docs/openapi.json
      - run: npm exec playwright install --with-deps chromium
      - run: npm run test:e2e --workspace @lifeline/web
# Decisions

- 2026-11-17: Use a new monorepo scaffold because the repository was empty; use SQLite only for direct local API development while Compose uses PostGIS-backed PostgreSQL.
- 2026-11-17: Use append-only signed ULID events; sync acknowledgements are idempotent by event ID. Browser key material is persisted in IndexedDB for reload continuity.
- 2026-11-17: Signature canonicalization covers every envelope field except `signature`, matching the envelope definition. Mesh hop mutation is a later M3 protocol migration.
- 2026-11-17: Keep a worker process in M0 so the service topology is present; asynchronous triage work begins in M2.
- 2026-11-17: M1's local media route caps upload size and returns content-derived IDs. Durable object storage, resumable chunks, content scanning, auth ownership, and server-side media persistence are deferred to hardening.
- 2026-11-17: Keep SOS map placement limited to GPS coordinates in M1. Manual offline basemap pins and last-known location require cached mapping data and are deferred.
- 2026-11-17: Docker is unavailable in this environment; Compose can be authored but its start-up acceptance cannot be demonstrated here.
